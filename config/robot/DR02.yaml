robot_xml_path: "asset/robot/DR02/mjcf/pro/DR02_pro.xml"
verbose: True
render_debug: True
keypoints_path: "output_data/keypoints/DR02/dance1_subject2_from_g1_keypoints.pkl"

# format: {joint_name: [low_range_offset, high_range_offset]}, degrees
joints_limit_offset_degrees:
  knee_joint: [10.0, 0.0]
  elbow_joint: [10.0, 0.0]

# blending offset for knee angle, degrees
knee_angle_offset_degrees: 15.0

# 通用连杆名称: [起点 body, 终点 body]
robot_links:
  left_hip: [base_link, left_hip_x_link]
  left_thigh: [left_hip_x_link, left_knee_link]
  left_calf: [left_knee_link, left_ankle_x_link]

  right_hip: [base_link, right_hip_x_link]
  right_thigh: [right_hip_x_link, right_knee_link]
  right_calf: [right_knee_link, right_ankle_x_link]

  neck: [base_link, neck_sphere]
  head: [neck_sphere, head_link]

  left_shoulder: [neck_sphere, left_shoulder_x_link]
  left_arm: [left_shoulder_x_link, left_elbow_link]
  left_fore_arm: [left_elbow_link, left_hand_link]

  right_shoulder: [neck_sphere, right_shoulder_x_link]
  right_arm: [right_shoulder_x_link, right_elbow_link]
  right_fore_arm: [right_elbow_link, right_hand_link]

contact_links: [left_foot_end_link, left_toe_link, 
                right_foot_end_link, right_toe_link, 
                left_hand_link, right_hand_link]

# "关键点名称": ["DR02 body名称", 位置代价权重, 姿态代价权重]
ik_match_table: {
  "hips_mean": ["base_link", 100, 0],  

  "left_hip": ["left_hip_x_link", 30, 3],
  "left_thigh": ["left_knee_link", 0.0, 3.0],
  "left_calf": ["left_ankle_x_link", 30, 3],

  "right_hip": ["right_hip_x_link", 30, 3],
  "right_thigh": ["right_knee_link", 0.0, 3.0],
  "right_calf": ["right_ankle_x_link", 30, 3],

  "head": ["head_link", 0.0, 3.0],

  "left_shoulder": ["left_shoulder_x_link", 30, 3],
  "left_arm": ["left_elbow_link", 10.0, 3],
  "left_fore_arm": ["left_hand_link", 10, 1],

  "right_shoulder": ["right_shoulder_x_link", 30, 3],
  "right_arm": ["right_elbow_link", 10.0, 3],
  "right_fore_arm": ["right_hand_link", 10, 1]

}

contact_vel_calculate_window: 6
contact_vel_threshold: 0.5
contact_height_threshold: 0.025
contact_height_lpf_alpha: 0.2
contact_pos_fixed_factor: 15.0

# Final DR02 motion-smoothing settings. Mink squares task costs in its
# least-squares objective, so temporal cost 10.0 is intentionally explicit.
temporal_continuity_regularization:
  enabled: true
  cost: 10.0
  joint_name_substrings: ["shoulder", "elbow", "wrist"]

# Per-frame hard joint-speed limits (rad/s) for the upper limbs.
inter_frame_velocity_limit:
  enabled: true
  joint_velocity_limits:
    shoulder: 8.0
    elbow: 8.0

# Initialize only frame zero with an isolated coarse solve, then use the
# normal full-body objective plus the temporal constraints above.
two_stage_optimization:
  enabled: true
  optimization_mode: first_frame_only
  initialize_root_from_target: true
  root_target_keypoint: hips_mean
  coarse:
    max_additional_iterations: 10
    convergence_threshold: 0.001
    ik_match_table: {
      "hips_mean": ["base_link", 0, 10],
      "left_hip": ["left_hip_x_link", 0, 10],
      "left_thigh": ["left_knee_link", 0, 10],
      "left_calf": ["left_ankle_x_link", 50, 10],
      "right_hip": ["right_hip_x_link", 0, 10],
      "right_thigh": ["right_knee_link", 0, 10],
      "right_calf": ["right_ankle_x_link", 50, 10],
      "head": ["head_link", 0, 100],
      "left_shoulder": ["left_shoulder_x_link", 0, 100],
      "left_arm": ["left_elbow_link", 0, 10],
      "left_fore_arm": ["left_hand_link", 10, 10],
      "right_shoulder": ["right_shoulder_x_link", 0, 100],
      "right_arm": ["right_elbow_link", 0, 10],
      "right_fore_arm": ["right_hand_link", 10, 10]
    }

# key_frame_config 用于把源数据中关键点的局部姿态，转换到目标机器人 body 所期望的局部坐标系约定下，
# 用于解决源数据和目标机器人之间的局部坐标系定义不一致问题。
key_frame_config:
  hips_mean:
    offset_deg_xyz: [0.0, 0.0, 0.0]
    axis_map_cols:
      x: [0.0, 0.0, 1.0]
      y: [1.0, 0.0, 0.0]
      z: [0.0, 1.0, 0.0]
  left_up_leg:
    offset_deg_xyz: [0.0, 0.0, 0.0]
    axis_map_cols:
      x: [0.0, 0.0, 1.0]
      y: [1.0, 0.0, 0.0]
      z: [0.0, 1.0, 0.0]
  left_leg:
    offset_deg_xyz: [0.0, 0.0, 0.0]
    axis_map_cols:
      x: [0.0, 0.0, 1.0]
      y: [1.0, 0.0, 0.0]
      z: [0.0, 1.0, 0.0]
  left_foot:
    offset_deg_xyz: [0.0, 0.0, 0.0]
    axis_map_cols:
      x: [0.0, 0.0, 1.0]
      y: [1.0, 0.0, 0.0]
      z: [0.0, 1.0, 0.0]
  right_up_leg:
    offset_deg_xyz: [0.0, 0.0, 0.0]
    axis_map_cols:
      x: [0.0, 0.0, 1.0]
      y: [1.0, 0.0, 0.0]
      z: [0.0, 1.0, 0.0]
  right_leg:
    offset_deg_xyz: [0.0, 0.0, 0.0]
    axis_map_cols:
      x: [0.0, 0.0, 1.0]
      y: [1.0, 0.0, 0.0]
      z: [0.0, 1.0, 0.0]
  right_foot:
    offset_deg_xyz: [0.0, 0.0, 0.0]
    axis_map_cols:
      x: [0.0, 0.0, 1.0]
      y: [1.0, 0.0, 0.0]
      z: [0.0, 1.0, 0.0]
  shoulder_mean:
    offset_deg_xyz: [0.0, 0.0, 0.0]
    axis_map_cols:
      x: [0.0, 0.0, 1.0]
      y: [1.0, 0.0, 0.0]
      z: [0.0, 1.0, 0.0]
  left_arm:
    offset_deg_xyz: [0.0, 0.0, 0.0]
    axis_map_cols:
      x: [0.0, 0.0, 1.0]
      y: [0.0, 1.0, 0.0]
      z: [-1.0, 0.0, 0.0]
  left_fore_arm:
    offset_deg_xyz: [0.0, 0.0, 0.0]
    axis_map_cols:
      x: [0.0, 0.0, 1.0]
      y: [0.0, 1.0, 0.0]
      z: [-1.0, 0.0, 0.0]
  left_hand:
    offset_deg_xyz: [0.0, 0.0, 0.0]
    axis_map_cols:
      x: [0.0, 0.0, 1.0]
      y: [0.0, 1.0, 0.0]
      z: [-1.0, 0.0, 0.0]
  right_arm:
    offset_deg_xyz: [0.0, 0.0, 0.0]
    axis_map_cols:
      x: [0.0, 0.0, 1.0]
      y: [0.0, -1.0, 0.0]
      z: [1.0, 0.0, 0.0]
  right_fore_arm:
    offset_deg_xyz: [0.0, 0.0, 0.0]
    axis_map_cols:
      x: [0.0, 0.0, 1.0]
      y: [0.0, -1.0, 0.0]
      z: [1.0, 0.0, 0.0]
  right_hand:
    offset_deg_xyz: [0.0, 0.0, 0.0]
    axis_map_cols:
      x: [0.0, 0.0, 1.0]
      y: [0.0, -1.0, 0.0]
      z: [1.0, 0.0, 0.0]
  head:
    offset_deg_xyz: [0.0, 0.0, 0.0]
    axis_map_cols:
      x: [0.0, 0.0, 1.0]
      y: [1.0, 0.0, 0.0]
      z: [0.0, 1.0, 0.0]
